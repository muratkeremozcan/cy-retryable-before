name: Publish Package

on:
  push:
    tags:
      - 'v*.*.*'

# Trusted publishing: npm exchanges this job's OIDC token for a short-lived
# credential, so no NPM_TOKEN secret exists to leak. --provenance then attaches a
# signed attestation tying the tarball to this workflow and commit.
permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the repository
      - uses: actions/checkout@v7

      # 2. Read Node version from .nvmrc
      - name: Read Node version from .nvmrc
        id: node_version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

      # 3. Set up Node.js with Auth Token
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org/'

      # 4. Trusted publishing needs npm 11.5.1 or newer, which Node 24 does not
      #    necessarily ship.
      - name: Ensure a trusted-publishing npm
        run: npm install --global npm@latest

      # 5. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 6. Build the project
      - name: Build
        run: npm run build

      # 7. Publish to npm
      - name: Publish
        run: npm publish --access public --provenance
